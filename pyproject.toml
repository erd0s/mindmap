[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmap-work-tracker"
version = "0.3.0"
description = "A small causal concept tree distilled from Codex and Claude Code sessions"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dirk Stewart" }]
license = "MIT"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
